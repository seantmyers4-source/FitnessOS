name: Terraform NONPROD Apply

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY-NONPROD after PMO approval"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-nonprod-apply
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ inputs.confirmation == 'APPLY-NONPROD' }}
    name: Controlled NONPROD apply
    runs-on: ubuntu-latest
    environment: fitnessos-nonprod
    defaults:
      run:
        working-directory: infra/terraform/nonprod
    steps:
      - name: Checkout main only
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: fitnessos-nonprod
          workload_identity_provider: projects/578189272278/locations/global/workloadIdentityPools/github-fitnessos/providers/github-actions
          service_account: fitnessos-tf-nonprod@fitnessos-nonprod.iam.gserviceaccount.com

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - name: Initialize protected backend
        run: terraform init -input=false -lock-timeout=5m

      - name: Recreate reviewed plan
        run: terraform plan -input=false -lock-timeout=5m -out=nonprod.tfplan

      - name: Apply
        run: terraform apply -input=false -lock-timeout=5m -auto-approve nonprod.tfplan
