name: Terraform Lock Bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/terraform-lock-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    name: Generate provider lock
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/nonprod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - name: Generate deterministic provider lock
        run: terraform providers lock -platform=linux_amd64

      - name: Upload provider lock
        uses: actions/upload-artifact@v4
        with:
          name: terraform-provider-lock
          path: infra/terraform/nonprod/.terraform.lock.hcl
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
