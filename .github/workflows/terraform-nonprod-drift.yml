name: Terraform NONPROD Drift Detection

on:
  schedule:
    - cron: "17 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-nonprod-drift
  cancel-in-progress: true

jobs:
  drift:
    name: Detect NONPROD drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/nonprod
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: fitnessos-nonprod
          workload_identity_provider: projects/578189272278/locations/global/workloadIdentityPools/github-fitnessos/providers/github-actions
          service_account: fitnessos-tf-plan-np@fitnessos-nonprod.iam.gserviceaccount.com

      - name: Verify dedicated Plan identity and read permissions
        shell: bash
        env:
          PLAN_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set +e
          mkdir -p preflight-evidence
          python3 ../../../scripts/cloud/gcp_plan_permission_preflight.py \
            --project fitnessos-nonprod \
            --state-bucket fitnessos-nonprod-tfstate-578189272278 \
            --expected-principal fitnessos-tf-plan-np@fitnessos-nonprod.iam.gserviceaccount.com \
            --workflow-ref "$PLAN_WORKFLOW_REF" \
            --output preflight-evidence/plan-permission-report.json
          status=$?
          sha256sum preflight-evidence/plan-permission-report.json \
            > preflight-evidence/checksums.sha256
          exit "$status"

      - name: Upload Plan preflight evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: terraform-drift-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: infra/terraform/nonprod/preflight-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - name: Initialize with committed lock
        run: |
          terraform init -input=false -lockfile=readonly -lock-timeout=5m
          git diff --exit-code -- .terraform.lock.hcl

      - name: Detect drift
        shell: bash
        run: |
          set +e
          terraform plan -input=false -lock-timeout=5m -detailed-exitcode
          exit_code=$?
          set -e
          if [ "$exit_code" -eq 0 ]; then
            echo "No drift detected."
          elif [ "$exit_code" -eq 2 ]; then
            echo "Drift detected; PMO review required."
            exit 2
          else
            exit "$exit_code"
          fi

