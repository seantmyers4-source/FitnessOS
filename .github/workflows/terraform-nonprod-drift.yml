name: Terraform NONPROD Drift Detection

on:
  schedule:
    - cron: "17 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-nonprod-drift
  cancel-in-progress: true

jobs:
  drift:
    name: Detect NONPROD drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/nonprod
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: fitnessos-nonprod
          workload_identity_provider: projects/578189272278/locations/global/workloadIdentityPools/github-fitnessos/providers/github-actions
          service_account: fitnessos-tf-nonprod@fitnessos-nonprod.iam.gserviceaccount.com

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - name: Initialize protected backend
        run: terraform init -input=false -lock-timeout=5m

      - name: Detect drift
        shell: bash
        run: |
          set +e
          terraform plan -input=false -lock-timeout=5m -detailed-exitcode
          exit_code=$?
          set -e
          if [ "$exit_code" -eq 0 ]; then
            echo "No drift detected."
          elif [ "$exit_code" -eq 2 ]; then
            echo "Drift detected; PMO review required."
            exit 2
          else
            exit "$exit_code"
          fi
