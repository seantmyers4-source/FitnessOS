name: Terraform NONPROD Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-nonprod-*.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-nonprod-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Validate and plan NONPROD
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/nonprod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: fitnessos-nonprod
          workload_identity_provider: projects/578189272278/locations/global/workloadIdentityPools/github-fitnessos/providers/github-actions
          service_account: fitnessos-tf-nonprod@fitnessos-nonprod.iam.gserviceaccount.com

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive ..

      - name: Initialize protected backend
        run: terraform init -input=false -lock-timeout=5m

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -lock-timeout=5m -out=nonprod.tfplan
