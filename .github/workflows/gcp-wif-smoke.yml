name: GCP WIF Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  authenticate:
    name: Verify keyless GCP authentication
    runs-on: ubuntu-latest
    steps:
      - name: Check out certified baseline branch
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: fitnessos-nonprod
          workload_identity_provider: projects/578189272278/locations/global/workloadIdentityPools/github-fitnessos/providers/github-actions
          service_account: fitnessos-tf-nonprod@fitnessos-nonprod.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify identity and Terraform state access
        shell: bash
        run: |
          gcloud auth list --filter=status:ACTIVE --format="value(account)"
          gcloud storage ls gs://fitnessos-nonprod-tfstate-578189272278
